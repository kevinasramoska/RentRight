name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore RentRight.slnx
      - run: dotnet build RentRight.slnx --no-restore --configuration Release
      - run: dotnet test RentRight.slnx --no-restore --configuration Release
