name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: React quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --check --format= HEAD
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ClientApp/package-lock.json
      - run: npm ci
        working-directory: ClientApp
      - name: Audit all frontend dependencies
        run: npm audit --audit-level=high
        working-directory: ClientApp
      - run: npm run lint && npm run type-check
        working-directory: ClientApp
      - name: Test React with JUnit report
        run: npm test -- --reporter=default --reporter=junit --outputFile=../TestResults/frontend.xml
        working-directory: ClientApp
      - run: npm run build
        working-directory: ClientApp
      - name: Share the actual React build with HTTP tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: react-host-assets
          path: wwwroot/app/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: frontend-test-results
          path: TestResults/frontend.xml
          if-no-files-found: warn
          retention-days: 7

  backend:
    name: .NET and SQL quality
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ContinuousIntegrationBuild: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: react-host-assets
          path: wwwroot/app/
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore all three projects with locked dependencies and audit
        run: dotnet restore RentRight.CI.slnx --locked-mode
      - name: Build once with warnings as errors
        run: dotnet build RentRight.CI.slnx --no-restore --configuration Release
      - name: Restore pinned EF tool and reject model drift
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project RentRight.csproj --configuration Release --no-build
      - name: Fast tests and production-assembly coverage
        run: >-
          dotnet test RentRight.Tests/RentRight.Tests.csproj --no-build --no-restore --configuration Release
          --logger "trx;LogFileName=fast.trx" --results-directory TestResults/fast
          --settings coverage.runsettings --collect:"Code Coverage;Format=Cobertura"
      - name: Full disposable SQL Server suite
        run: >-
          dotnet test RentRight.Tests/SqlIntegration/RentRight.SqlIntegration.Tests.csproj
          --no-build --no-restore --configuration Release
          --logger "trx;LogFileName=sql.trx" --results-directory TestResults/sql
          --blame-hang-timeout 5m
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: backend-test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/*.cobertura.xml
          if-no-files-found: warn
          retention-days: 7

  container:
    name: Container quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build and scan the production image
        run: |
          docker build --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" --tag rentright:ci .
          bash scripts/scan-image.sh rentright:ci
      - name: Verify isolated HTTPS Compose lifecycle
        run: node scripts/verify-compose.mjs
        timeout-minutes: 12
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: container-vulnerability-report
          path: TestResults/container-vulnerabilities.json
          if-no-files-found: warn
          retention-days: 7

  quality-gate:
    name: Required quality gate
    if: ${{ always() }}
    needs: [frontend, backend, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every quality job to succeed
        env:
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
          CONTAINER: ${{ needs.container.result }}
        run: '[[ "$FRONTEND" == success && "$BACKEND" == success && "$CONTAINER" == success ]]'
