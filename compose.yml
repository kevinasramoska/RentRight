# Local development only. Use scripts/local-dev.sh; never supply production data.
x-application: &application
  image: ${COMPOSE_PROJECT_NAME:-rentright-local}-app:dev
  build:
    context: .
    args:
      VERSION: local-compose
      REVISION: ${RENTRIGHT_REVISION:-unknown}
  networks: [local]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  mem_limit: 768m

x-database-environment: &database-environment
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__DefaultConnection: Server=sql,1433;Database=RentRightLocal;User ID=sa;Password=${RENTRIGHT_SQL_PASSWORD:?Run local-dev.sh init first};Encrypt=True;TrustServerCertificate=True
  Geocoding__Enabled: "false"
  Logging__LogLevel__Microsoft: Warning

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04@sha256:c1aa8afe9b06eab64c9774a4802dcd032205d1be785b1fd51e1c0151e7586b74
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${RENTRIGHT_SQL_PASSWORD:?Run local-dev.sh init first}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    volumes: [sql-data:/var/opt/mssql]
    networks: [local]
    cap_drop: [ALL]
    # The upstream sqlservr executable declares this file capability (even on 1433).
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    healthcheck:
      test: [CMD-SHELL, 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -I -b -l 3 -Q "SELECT 1" > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    stop_grace_period: 30s

  initialize:
    <<: *application
    command: [--initialize-local]
    environment:
      <<: *database-environment
      LocalDevelopment__AllowInitialization: "true"
      SeedAdmin__Email: ${RENTRIGHT_ADMIN_EMAIL:?Run local-dev.sh init first}
      SeedAdmin__Password: ${RENTRIGHT_ADMIN_PASSWORD:?Run local-dev.sh init first}
    depends_on:
      sql:
        condition: service_healthy
    restart: "no"

  app:
    <<: *application
    networks: [local, web]
    environment:
      <<: *database-environment
      ASPNETCORE_HTTP_PORTS: ""
      ASPNETCORE_HTTPS_PORTS: "8443"
      Kestrel__Certificates__Default__Path: /run/local-certs/localhost.pem
      Kestrel__Certificates__Default__KeyPath: /run/local-certs/localhost.key
      Security__DataProtection__KeyRingPath: /var/lib/rentright/keys
      Security__DataProtection__ApplicationName: RentRight.LocalCompose
    ports:
      - "127.0.0.1:${RENTRIGHT_HTTPS_PORT:-7443}:8443"
    volumes:
      - data-protection:/var/lib/rentright/keys
      - type: bind
        source: ${RENTRIGHT_CERT_DIR:?Run local-dev.sh init first}
        target: /run/local-certs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      sql:
        condition: service_healthy
      initialize:
        condition: service_completed_successfully
    # Startup socket check only; full operational health remains P13-01.
    healthcheck:
      test: [CMD, /bin/bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8443']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 20s

networks:
  local:
    internal: true
  web:

volumes:
  sql-data:
  data-protection:
